version: "1.0"
sources:
  - id: openalex_api
    label: "OpenAlex API"
    role: "Поиск сущностей, оценка объема среза, справочники и точечное обогащение ORCID/ROR/DOI. Не используется для скачивания полного среза."
    status: "implemented"
    default: false
    supports:
      - resolve_ids
      - search
      - group_by_estimate
      - sample_estimate
      - select_fields
  - id: openalex_cli
    label: "Загрузчик OpenAlex"
    role: "Официальное скачивание выбранных работ OpenAlex с возобновлением и параллельной загрузкой; установленный загрузчик требует ключ OpenAlex."
    status: "implemented"
    default: true
    install: "pip install openalex-official"
    supports:
      - filtered_work_metadata
      - filter_only_download
      - doi_resolution
      - checkpointing
      - adaptive_rate_limiting
      - parallel_downloads
  - id: openalex_changefiles
    label: "OpenAlex changefiles"
    role: "Инкрементальные обновления локального хранилища за последние доступные даты."
    status: "planned"
    supports:
      - jsonl_gz
      - parquet
      - upsert_by_id
  - id: openalex_snapshot_jsonl
    label: "OpenAlex public snapshot JSONL"
    role: "Полная квартальная копия OpenAlex через S3/AWS CLI без авторизации; не используется как основной режим ноутбука."
    status: "prepared"
    supports:
      - aws_s3_sync
      - manifest
      - jsonl_gz
  - id: openalex_snapshot_parquet
    label: "OpenAlex snapshot Parquet"
    role: "Parquet snapshot для серверного/enterprise режима; не является основным режимом ноутбука и не используется без локального/серверного lakehouse."
    status: "research_note"
    research_note: "Документация OpenAlex описывает enterprise Parquet snapshot и план публичного Parquet snapshot; в DSS это будущий provider, а не готовый источник маленьких тематических срезов."
    supports:
      - parquet
      - duckdb
      - s3
  - id: local_filesystem
    label: "Локальная папка данных"
    role: "Уже скачанные локальные срезы: Raw JSONL.GZ, Parquet-витрины, паспорта, отчеты и API-кэш вне репозитория."
    status: "implemented"
    supports:
      - raw_jsonl_gz
      - parquet
      - passports
      - reports
