version: "1.0"
metrics:
  - metric_id: "p"
    label: "Публикации"
    group: "Публикационная активность"
    formula: "count_distinct(work_id)"
    source: "computed_from_slice_works"
    local_only: true
    visible: true
  - metric_id: "c"
    label: "Цитирования"
    group: "Цитируемость"
    formula: "sum(cited_by_count)"
    source: "computed_from_slice_works"
    local_only: true
    visible: true
  - metric_id: "c_frac"
    label: "Цитирования с долевым учетом"
    group: "Цитируемость с учетом соавторства"
    formula: "sum(cited_by_count / authors_count_used)"
    source: "computed_from_slice_works"
    local_only: true
    visible: true
  - metric_id: "cpp"
    label: "Средняя цитируемость"
    group: "Цитируемость"
    formula: "C / P"
    source: "computed_from_slice_works"
    local_only: true
    visible: true
  - metric_id: "h"
    label: "Индекс Хирша"
    group: "Устойчивое цитируемое ядро"
    algorithm: "h_index"
    source: "computed_from_slice_works"
    local_only: true
    visible: true
  - metric_id: "g"
    label: "Индекс g"
    group: "Сильные цитируемые работы"
    algorithm: "g_index"
    source: "computed_from_slice_works"
    local_only: true
    visible: true
  - metric_id: "i10"
    label: "Работы с 10+ цитированиями"
    group: "Пороговые индексы"
    algorithm: "count_works_with_citations_at_least"
    params:
      threshold: 10
    source: "computed_from_slice_works"
    local_only: true
    visible: true
  - metric_id: "m_local"
    label: "Индекс m внутри среза"
    group: "Пороговые индексы"
    formula: "h / local_publication_age"
    source: "computed_from_slice_works"
    local_only: true
    visible: true
  - metric_id: "top1_share"
    label: "Доля самой цитируемой работы"
    group: "Диагностика концентрации"
    formula: "max(cited_by_count) / sum(cited_by_count)"
    source: "computed_from_slice_works"
    local_only: true
    visible: true
  - metric_id: "f5"
    label: "Индекс Полянина f5"
    group: "Дополнительные показатели"
    formula: "count(works where cited_by_count >= 5)"
    source: "computed_from_slice_works"
    local_only: true
    visible: true
    warning: "Пороговый показатель: число публикаций с 5 и более цитированиями."
  - metric_id: "fm5"
    label: "Долевой индекс Полянина fm5"
    group: "Дополнительные показатели"
    formula: "sum(credit_weight for works where cited_by_count >= 5)"
    source: "computed_from_slice_works"
    local_only: true
    visible: true
    warning: "Пороговый показатель с долевым учетом вклада автора."
  - metric_id: "iupv"
    label: "Рейтинговая формула: активность и цитируемость"
    group: "Дополнительные показатели"
    formula: "100 * (pr(P) * pr(h) * pr(C_frac)) ** (1/3)"
    source: "computed_from_slice_works"
    local_only: true
    visible: true
    warning: "Формула рейтинга на процентильной шкале: объединяет число публикаций, индекс Хирша и долевые цитирования внутри выбранного среза."
  - metric_id: "islv"
    label: "Рейтинговая формула: сбалансированный вклад"
    group: "Дополнительные показатели"
    formula: "100 * weighted_geometric_mean(pr(h), pr(C_frac), pr(g), pr(i10), pr(P)) * concentration_penalty"
    source: "computed_from_slice_works"
    local_only: true
    visible: true
    warning: "Формула рейтинга на процентильной шкале: объединяет индекс Хирша, долевые цитирования, индекс g, i10 и публикации с поправкой на концентрацию цитирований."
  - metric_id: "lrdi"
    label: "Индекс устойчивости результата"
    group: "Дополнительные показатели"
    formula: "local robust discounted fractional impact"
    source: "computed_from_slice_works"
    local_only: true
    visible: true
native_metrics:
  - metric_id: "p"
    label: "Глобальное число работ OpenAlex"
    group: "Быстрая витрина Authors API"
    source: "openalex_author_object"
    source_field: "works_count"
    warning: "Не является локальным числом работ в выбранном срезе."
  - metric_id: "c"
    label: "Глобальные цитирования OpenAlex"
    group: "Быстрая витрина Authors API"
    source: "openalex_author_object"
    source_field: "cited_by_count"
    warning: "Не является локальной цитируемостью в выбранном срезе."
  - metric_id: "h"
    label: "Глобальный индекс Хирша OpenAlex"
    group: "Быстрая витрина Authors API"
    source: "openalex_author_object"
    source_field: "summary_stats.h_index"
    warning: "Используется только для предварительного просмотра, не для научного вывода по срезу."
  - metric_id: "i10"
    label: "Глобальный i10-индекс OpenAlex"
    group: "Быстрая витрина Authors API"
    source: "openalex_author_object"
    source_field: "summary_stats.i10_index"
    warning: "Используется только для предварительного просмотра, не для научного вывода по срезу."
  - metric_id: "two_year_mean_citedness"
    label: "2-year mean citedness OpenAlex"
    group: "Быстрая витрина Authors API"
    source: "openalex_author_object"
    source_field: "summary_stats.2yr_mean_citedness"
    warning: "Глобальное поле OpenAlex Authors, не показатель выбранного среза."
