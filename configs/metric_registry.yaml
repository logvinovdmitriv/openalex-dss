version: "1.0"
metrics:
  - metric_id: "p"
    label: "Публикации"
    group: "Публикационная активность"
    formula: "count_distinct(work_id)"
    source: "computed_from_slice_works"
    local_only: true
    visible: true
  - metric_id: "c"
    label: "Цитирования"
    group: "Цитируемость"
    formula: "sum(cited_by_count)"
    source: "computed_from_slice_works"
    local_only: true
    visible: true
  - metric_id: "c_frac"
    label: "Цитирования с долевым учетом"
    group: "Цитируемость с учетом соавторства"
    formula: "sum(cited_by_count / authors_count_used)"
    source: "computed_from_slice_works"
    local_only: true
    visible: true
  - metric_id: "cpp"
    label: "Средняя цитируемость"
    group: "Цитируемость"
    formula: "C / P"
    source: "computed_from_slice_works"
    local_only: true
    visible: false
  - metric_id: "h"
    label: "Индекс Хирша"
    group: "Устойчивое цитируемое ядро"
    algorithm: "h_index"
    source: "computed_from_slice_works"
    local_only: true
    visible: true
  - metric_id: "g"
    label: "Индекс g"
    group: "Сильные цитируемые работы"
    algorithm: "g_index"
    source: "computed_from_slice_works"
    local_only: true
    visible: true
  - metric_id: "i10"
    label: "Работы с 10+ цитированиями"
    group: "Пороговые индексы"
    algorithm: "count_works_with_citations_at_least"
    params:
      threshold: 10
    source: "computed_from_slice_works"
    local_only: true
    visible: true
  - metric_id: "m_local"
    label: "Индекс m внутри среза"
    group: "Пороговые индексы"
    formula: "h / local_publication_age"
    source: "computed_from_slice_works"
    local_only: true
    visible: false
  - metric_id: "top1_share"
    label: "Доля самой цитируемой работы"
    group: "Диагностика концентрации"
    formula: "max(cited_by_count) / sum(cited_by_count)"
    source: "computed_from_slice_works"
    local_only: true
    visible: false
  - metric_id: "rfi_log_frac"
    label: "RFI: логарифмический долевой вклад"
    group: "Диагностика робастного вклада"
    formula: "sum(log1p(cited_credit))"
    source: "computed_from_slice_works"
    local_only: true
    visible: false
    warning: "Промежуточное поле для IUPV-S: учитывает все работы автора, долевой вклад и сглаживание citation outliers."
  - metric_id: "f5"
    label: "Работы с 5+ цитированиями"
    group: "Дополнительные показатели"
    formula: "count(works where cited_by_count >= 5)"
    source: "computed_from_slice_works"
    local_only: true
    visible: false
    warning: "Дополнительный пороговый показатель. Он не подается как канонический именованный индекс без подтверждения первоисточником."
  - metric_id: "fm5"
    label: "Долевой вклад в работы с 5+ цитированиями"
    group: "Дополнительные показатели"
    formula: "sum(credit_weight for works where cited_by_count >= 5)"
    source: "computed_from_slice_works"
    local_only: true
    visible: false
    warning: "Дополнительный пороговый показатель с долевым учетом. Он не подается как канонический именованный индекс без подтверждения первоисточником."
  - metric_id: "pci"
    label: "PCI: процентильный композит активности и цитируемости"
    group: "Дополнительные показатели"
    formula: "100 * (pr(P) * pr(h) * pr(C_frac)) ** (1/3)"
    source: "computed_from_slice_works"
    local_only: true
    visible: false
    warning: "Экспериментальная процентильная формула PCI. Не является IUPV из расширенной методологии и не входит в baseline популярных индексов."
  - metric_id: "iupv_s"
    label: "IUPV-S: простой робастный долевой вклад"
    group: "Дополнительные показатели"
    formula: "100 * percentile_rank(sum(log1p(cited_credit)))"
    source: "computed_from_slice_works"
    local_only: true
    visible: false
    warning: "Авторская extension-формула: долевой вклад, логарифмическое сглаживание и процентильная шкала 0-100 внутри текущего среза."
  - metric_id: "iupv_sb"
    label: "IUPV-SB: баланс публикаций и робастного вклада"
    group: "Дополнительные показатели"
    formula: "100 * sqrt(pr(P) * pr(RFI))"
    source: "computed_from_slice_works"
    local_only: true
    visible: false
    warning: "Расширенная версия IUPV-S, где автор должен иметь высокий процентиль и по публикациям, и по робастному долевому вкладу."
  - metric_id: "islv"
    label: "Процентильная формула: сбалансированный вклад"
    group: "Дополнительные показатели"
    formula: "100 * weighted_geometric_mean(pr(h), pr(C_frac), pr(g), pr(i10), pr(P)) * concentration_penalty"
    source: "computed_from_slice_works"
    local_only: true
    visible: false
    warning: "Экспериментальная формула рейтинга. Не используется как основной рейтинг по умолчанию."
  - metric_id: "lrdi"
    label: "Индекс устойчивости результата"
    group: "Дополнительные показатели"
    formula: "local robust discounted fractional impact"
    source: "computed_from_slice_works"
    local_only: true
    visible: false
native_metrics:
  - metric_id: "p"
    label: "Глобальное число работ OpenAlex"
    group: "Быстрая витрина Authors API"
    source: "openalex_author_object"
    source_field: "works_count"
    warning: "Не является локальным числом работ в выбранном срезе."
  - metric_id: "c"
    label: "Глобальные цитирования OpenAlex"
    group: "Быстрая витрина Authors API"
    source: "openalex_author_object"
    source_field: "cited_by_count"
    warning: "Не является локальной цитируемостью в выбранном срезе."
  - metric_id: "h"
    label: "Глобальный индекс Хирша OpenAlex"
    group: "Быстрая витрина Authors API"
    source: "openalex_author_object"
    source_field: "summary_stats.h_index"
    warning: "Используется только для предварительного просмотра, не для научного вывода по срезу."
  - metric_id: "i10"
    label: "Глобальный i10-индекс OpenAlex"
    group: "Быстрая витрина Authors API"
    source: "openalex_author_object"
    source_field: "summary_stats.i10_index"
    warning: "Используется только для предварительного просмотра, не для научного вывода по срезу."
  - metric_id: "two_year_mean_citedness"
    label: "2-year mean citedness OpenAlex"
    group: "Быстрая витрина Authors API"
    source: "openalex_author_object"
    source_field: "summary_stats.2yr_mean_citedness"
    warning: "Глобальное поле OpenAlex Authors, не показатель выбранного среза."
