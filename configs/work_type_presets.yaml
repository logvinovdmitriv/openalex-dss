version: "1.0"
work_types:
  - preset_id: "articles"
    label: "Журнальные статьи"
    public_description: "Самый чистый базовый корпус для сравнения индексов."
    openalex_types:
      - "article"
  - preset_id: "articles_reviews"
    label: "Статьи и обзоры"
    public_description: "Корпус статей вместе с обзорными публикациями."
    openalex_types:
      - "article"
      - "review"
  - preset_id: "articles_reviews_conference_sources"
    label: "Статьи и обзоры из конференционных источников"
    public_description: "OpenAlex не использует отдельный work type для конференций; конференционность задавайте source type = conference."
    openalex_types:
      - "article"
      - "review"
