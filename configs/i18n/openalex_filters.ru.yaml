version: "2026-05-10"
locale: "ru"
filters:
  subject_primary_topic:
    label: "Основная тема работы"
    short_label: "Основная тема"
    description: "Работа попадает в срез, если ее основная тема OpenAlex относится к выбранной области, подобласти или теме."
    user_hint: "Рекомендуемый режим для строгого baseline-среза."
  subject_topics_any:
    label: "Любая тема работы"
    short_label: "Любая тема"
    description: "Расширенный тематический режим: учитываются все темы работы, а не только основная."
    user_hint: "Используйте для sensitivity-анализа, а не как основной baseline."
  keyword:
    label: "Ключевое слово OpenAlex"
    short_label: "Ключевое слово"
    description: "Отбирает работы по идентификатору keyword в OpenAlex."
  country:
    label: "Страна организации автора"
    short_label: "Страна автора"
    description: "Фильтр по стране организаций, указанных в authorships работы."
    warning: "Для финального анализа применяется локально после материализации полного среза, чтобы не зависеть от обрезки authorships в list-ответах OpenAlex."
  institution:
    label: "Организация автора"
    short_label: "Организация"
    description: "Фильтр по организации, указанной в authorships работы."
    warning: "Для финального анализа применяется локально после материализации полного среза."
  author:
    label: "Автор"
    short_label: "Автор"
    description: "Фильтр по OpenAlex ID автора."
    warning: "Для финального анализа применяется локально после материализации полного среза."
  work_type:
    label: "Тип публикации"
    short_label: "Тип"
    description: "Ограничивает срез типами работ OpenAlex, например article, review или conference-paper."
  from_publication_date:
    label: "Дата публикации от"
    short_label: "Дата от"
    description: "Нижняя граница периода публикаций."
  to_publication_date:
    label: "Дата публикации до"
    short_label: "Дата до"
    description: "Верхняя граница периода публикаций."
  from_created_date:
    label: "Дата создания записи от"
    short_label: "Создана от"
    description: "Нижняя граница даты появления записи в OpenAlex."
  to_created_date:
    label: "Дата создания записи до"
    short_label: "Создана до"
    description: "Верхняя граница даты появления записи в OpenAlex."
  from_updated_date:
    label: "Дата обновления записи от"
    short_label: "Обновлена от"
    description: "Нижняя граница даты последнего обновления записи OpenAlex."
  to_updated_date:
    label: "Дата обновления записи до"
    short_label: "Обновлена до"
    description: "Верхняя граница даты последнего обновления записи OpenAlex."
  publication_year:
    label: "Год публикации"
    short_label: "Год"
    description: "Фильтр по году публикации работы."
  is_retracted:
    label: "Исключить отозванные работы"
    short_label: "Без отозванных"
    description: "Отозванные публикации не включаются в расчет."
  is_paratext:
    label: "Исключить служебные тексты"
    short_label: "Без paratext"
    description: "Служебные записи OpenAlex не включаются в расчет."
  is_xpac:
    label: "Исключить XPAC"
    short_label: "Без XPAC"
    description: "XPAC-записи исключаются по умолчанию из-за более низкой сопоставимости данных."
  has_doi:
    label: "Наличие DOI"
    short_label: "Есть DOI"
    description: "Оставляет работы с DOI или без DOI."
  has_references:
    label: "Наличие списка литературы"
    short_label: "Есть ссылки"
    description: "Оставляет работы, у которых OpenAlex содержит список ссылок."
  has_fulltext:
    label: "Наличие fulltext-индекса"
    short_label: "Есть fulltext"
    description: "Оставляет работы с доступным fulltext-индексом OpenAlex."
  is_oa:
    label: "Открытый доступ"
    short_label: "Open Access"
    description: "Ограничивает работы по признаку открытого доступа."
  oa_status:
    label: "Статус открытого доступа"
    short_label: "OA-статус"
    description: "Фильтр по статусу open access в OpenAlex."
  cited_by_count:
    label: "Цитирований работы"
    short_label: "Цитирования"
    description: "Фильтр по числу цитирований конкретной работы."
  cited_by:
    label: "Цитируется работой"
    short_label: "Цитируется"
    description: "Экспертный фильтр по работам, которые цитируют выбранную работу."
  cites:
    label: "Ссылается на работу"
    short_label: "Ссылается"
    description: "Экспертный фильтр по работам, содержащим ссылку на выбранную работу."
  referenced_works:
    label: "Ссылки на работы"
    short_label: "Ссылки"
    description: "Экспертный фильтр по связанным ссылкам works."
  openalex_id:
    label: "OpenAlex ID работы"
    short_label: "ID работы"
    description: "Фильтр по одному или нескольким идентификаторам работ OpenAlex."
