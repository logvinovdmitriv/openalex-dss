version: "1.0"
filters:
  subject_primary_topic:
    label: "Основная тема работы"
    class: "openalex_pushdown"
    works_filter:
      field: "primary_topic"
      supports_levels: ["field", "subfield", "topic"]
  subject_topics_any:
    label: "Любая тема работы"
    class: "openalex_pushdown"
    works_filter:
      field: "topics"
      supports_levels: ["field", "subfield", "topic"]
  keyword:
    label: "OpenAlex keyword"
    class: "openalex_pushdown"
    works_filter:
      field: "keywords.id"
  country:
    label: "Страна организации автора"
    class: "fetch_pushdown_risky_authorship"
    local_class: "local_materialized_filter"
    final_analysis_policy: "local_after_materialization"
    risk_reason: "Фильтр относится к authorships. В list-ответах OpenAlex список authorships может быть обрезан для работ с большим числом авторов, поэтому для финального анализа фильтр должен применяться локально после материализации среза."
    works_filter:
      field: "authorships.institutions.country_code"
  institution:
    label: "Организация автора"
    class: "fetch_pushdown_risky_authorship"
    local_class: "local_materialized_filter"
    final_analysis_policy: "local_after_materialization"
    risk_reason: "Фильтр относится к authorships. В list-ответах OpenAlex список authorships может быть обрезан для работ с большим числом авторов, поэтому для финального анализа фильтр должен применяться локально после материализации среза."
    works_filter:
      field: "authorships.institutions.id"
      max_or_values: 100
  author:
    label: "Автор"
    class: "fetch_pushdown_risky_authorship"
    local_class: "local_materialized_filter"
    final_analysis_policy: "local_after_materialization"
    risk_reason: "Фильтр относится к authorships. В list-ответах OpenAlex список authorships может быть обрезан для работ с большим числом авторов, поэтому для финального анализа фильтр должен применяться локально после материализации среза."
    works_filter:
      field: "authorships.author.id"
      max_or_values: 100
  source:
    label: "Источник / журнал"
    class: "openalex_pushdown"
    works_filter:
      field: "primary_location.source.id"
      max_or_values: 100
  work_type:
    label: "Тип публикации"
    class: "openalex_pushdown"
    works_filter:
      field: "type"
  from_publication_date:
    label: "Дата публикации от"
    class: "openalex_pushdown"
    works_filter:
      field: "from_publication_date"
  to_publication_date:
    label: "Дата публикации до"
    class: "openalex_pushdown"
    works_filter:
      field: "to_publication_date"
  from_created_date:
    label: "Дата создания записи от"
    class: "openalex_pushdown"
    works_filter:
      field: "from_created_date"
  to_created_date:
    label: "Дата создания записи до"
    class: "openalex_pushdown"
    works_filter:
      field: "to_created_date"
  from_updated_date:
    label: "Дата обновления записи от"
    class: "openalex_pushdown"
    works_filter:
      field: "from_updated_date"
  to_updated_date:
    label: "Дата обновления записи до"
    class: "openalex_pushdown"
    works_filter:
      field: "to_updated_date"
  publication_year:
    label: "Год публикации"
    class: "openalex_pushdown"
    works_filter:
      field: "publication_year"
  is_retracted:
    label: "Исключить отозванные работы"
    class: "openalex_pushdown"
    works_filter:
      field: "is_retracted"
  is_paratext:
    label: "Исключить служебные тексты"
    class: "openalex_pushdown"
    works_filter:
      field: "is_paratext"
  is_xpac:
    label: "Исключить XPAC"
    class: "openalex_pushdown"
    works_filter:
      field: "is_xpac"
  language:
    label: "Язык публикации"
    class: "openalex_pushdown"
    works_filter:
      field: "language"
  open_access:
    label: "Открытый доступ"
    class: "openalex_pushdown"
    works_filter:
      field: "open_access.is_oa"
  min_citations:
    label: "Минимум цитирований работы"
    class: "openalex_pushdown"
    works_filter:
      field: "cited_by_count"
      operator: ">"
  doi:
    label: "DOI"
    class: "openalex_pushdown"
    works_filter:
      field: "doi"
  source_type:
    label: "Тип источника"
    class: "openalex_pushdown"
    works_filter:
      field: "primary_location.source.type"
  has_abstract:
    label: "Наличие аннотации"
    class: "openalex_pushdown"
    works_filter:
      field: "has_abstract"
  has_doi:
    label: "Наличие DOI"
    class: "openalex_pushdown"
    works_filter:
      field: "has_doi"
  has_references:
    label: "Наличие списка литературы"
    class: "openalex_pushdown"
    works_filter:
      field: "has_references"
  has_fulltext:
    label: "Наличие fulltext-индекса"
    class: "openalex_pushdown"
    works_filter:
      field: "has_fulltext"
  is_oa:
    label: "Открытый доступ"
    class: "openalex_pushdown"
    works_filter:
      field: "is_oa"
  oa_status:
    label: "Статус открытого доступа"
    class: "openalex_pushdown"
    works_filter:
      field: "open_access.oa_status"
  cited_by_count:
    label: "Цитирований работы"
    class: "openalex_pushdown"
    works_filter:
      field: "cited_by_count"
      operator: "range"
  cited_by:
    label: "Цитирует работу"
    class: "openalex_pushdown"
    works_filter:
      field: "cited_by"
      max_or_values: 100
  cites:
    label: "Ссылается на работу"
    class: "openalex_pushdown"
    works_filter:
      field: "cites"
      max_or_values: 100
  referenced_works:
    label: "Ссылки на работы"
    class: "openalex_pushdown"
    works_filter:
      field: "referenced_works"
      max_or_values: 100
  openalex_id:
    label: "OpenAlex ID работы"
    class: "openalex_pushdown"
    works_filter:
      field: "openalex"
      max_or_values: 100
  min_local_h:
    label: "Минимальный локальный h-index"
    class: "derived_after_metrics"
    derived_field: "h"
  min_local_publications:
    label: "Минимум публикаций автора в срезе"
    class: "derived_after_metrics"
    derived_field: "p"
sort:
  default: "publication_date:asc,openalex:asc"
special_parameters:
  search:
    label: "Полнотекстовый поиск OpenAlex API"
    api_parameter: "search"
    api_estimate_supported: true
    cli_supported: false
    reason: "Установленный загрузчик OpenAlex принимает --filter, но не параметр search из Works API; для поисковых срезов нужен отдельный режим скачивания по списку work IDs."
facets:
  work_types:
    label: "Типы публикаций"
    group_by: "type"
  publication_years:
    label: "Годы публикаций"
    group_by: "publication_year"
  countries:
    label: "Страны аффилиаций"
    group_by: "authorships.institutions.country_code"
unsupported:
  city:
    label: "Город"
    reason: "Works API не имеет прямого надежного city-фильтра. Возможен будущий UI-presets слой city -> institution IDs."
  gender:
    label: "Пол автора"
    reason: "OpenAlex не предоставляет это поле."
  age:
    label: "Возраст автора"
    reason: "OpenAlex не предоставляет это поле."
