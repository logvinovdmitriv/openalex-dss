version: "1.0"
protocols:
  baseline_core:
    label_ru: "Базовое сравнение популярных индексов"
    description_ru: "Воспроизводимый базовый протокол: P, C, C_frac, h, i10 и g по полному backend-срезу."
    metrics: [p, c, c_frac, h, i10, g]
    fraction_mode: strict_authors_count
    eligibility:
      min_p: 1
    outputs:
      - descriptive
      - chart_readiness
      - spearman
      - kendall_tau_b
      - topn_overlap
      - rank_delta
      - report_findings
    final_gate:
      require_complete_dump: true
      require_signatures: true
      require_backfill_complete: true
      require_core_metrics: true
      require_checksums: true
  custom_formula_validation:
    label_ru: "Проверка пользовательской формулы"
    description_ru: "СППР-протокол для проверки новой формулы относительно baseline-метрик."
    baseline_metrics: [p, c, c_frac, h, i10, g]
    required_tests:
      - distribution_readiness
      - correlation_vs_core
      - topn_overlap_vs_h
      - topn_overlap_vs_c_frac
      - top1_removed_stability
      - fractional_vs_integer_shift
      - coauthorship_bias_check
      - tie_rate_check
    acceptance_hints:
      high_duplicate_threshold: 0.98
      low_relation_threshold: 0.30
      useful_relation_min: 0.60
      useful_relation_max: 0.95
templates:
  iupv_light:
    label_ru: "IUPV-Light"
    description_ru: "Сбалансированная формула: публикационная устойчивость, долевая цитируемость и штраф за зависимость от одной сверхцитируемой работы."
    expression_template: "100 * sqrt(p / (p + {N0})) * (log1p(c_frac) / (1 + log1p(c_frac))) * (1 - {alpha} * max(0, (top1_share - {tau}) / (1 - {tau})))"
    parameters:
      N0:
        value: 5
        min: 1
        max: 20
        step: 1
        label_ru: "Порог публикационной устойчивости"
      alpha:
        value: 0.25
        min: 0
        max: 0.8
        step: 0.05
        label_ru: "Сила штрафа за концентрацию"
      tau:
        value: 0.6
        min: 0.3
        max: 0.9
        step: 0.05
        label_ru: "Допустимая доля top-1 работы"
    base_fields: [p, c_frac, top1_share]
    range: [0, 100]
