version: "1.0"
protocols:
  baseline_core:
    label_ru: "Базовое сравнение популярных индексов"
    description_ru: "Воспроизводимый базовый протокол: P, C, C_frac, h, i10 и g по полному backend-срезу."
    metrics: [p, c, c_frac, h, i10, g]
    fraction_mode: strict_authors_count
    eligibility:
      min_p: 1
    outputs:
      - descriptive
      - chart_readiness
      - spearman
      - kendall_tau_b
      - topn_overlap
      - rank_delta
      - report_findings
    final_gate:
      require_complete_dump: true
      require_signatures: true
      require_backfill_complete: true
      require_core_metrics: true
      require_checksums: true
  custom_formula_validation:
    label_ru: "Проверка пользовательской формулы"
    description_ru: "СППР-протокол для проверки новой формулы относительно baseline-метрик."
    baseline_metrics: [p, c, c_frac, h, i10, g]
    required_tests:
      - distribution_readiness
      - correlation_vs_core
      - topn_overlap_vs_h
      - topn_overlap_vs_c_frac
      - top1_removed_stability
      - fractional_vs_integer_shift
      - coauthorship_bias_check
      - tie_rate_check
    acceptance_hints:
      high_duplicate_threshold: 0.98
      low_relation_threshold: 0.30
      useful_relation_min: 0.60
      useful_relation_max: 0.95
templates:
  iupv_s:
    label_ru: "IUPV-S"
    description_ru: "Простая робастная формула: все работы автора, долевой вклад, log1p-сглаживание и процентильная шкала 0-100."
    expression_template: "100 * pr_rfi_log_frac"
    parameters: {}
    base_fields: [rfi_log_frac]
    range: [0, 100]
  iupv_sb:
    label_ru: "IUPV-SB"
    description_ru: "Расширение IUPV-S: балансирует процентиль публикационной активности и процентиль робастного долевого вклада."
    expression_template: "100 * sqrt(pr_p * pr_rfi_log_frac)"
    parameters: {}
    base_fields: [p, rfi_log_frac]
    range: [0, 100]
