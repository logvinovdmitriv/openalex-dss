version: "1.0"
profiles:
  - profile_id: "slice_local_default"
    label: "Единый локальный рейтинг"
    description: "Основной профиль для works-first расчета и UI. Равные значения индекса разрешаются одинаково в CSV, API и интерфейсе."
    metric_scope: "computed_from_slice_works"
    default_primary_metric: "islv"
    sort:
      - field: "__primary_metric__"
        direction: "desc"
      - field: "c"
        direction: "desc"
      - field: "p"
        direction: "desc"
      - field: "author_id"
        direction: "asc"
    passport_key: "rank_by_metric_desc_c_desc_p_desc_author_id_asc"
  - profile_id: "openalex_native_preview"
    label: "Быстрая витрина OpenAlex Authors"
    description: "Только предварительный просмотр глобальных author profile fields OpenAlex; не используется как доказательный локальный рейтинг."
    metric_scope: "openalex_author_object"
    default_primary_metric: "h"
    warning: "Native author metrics are global profile metrics and are not local indices for the selected works slice."
