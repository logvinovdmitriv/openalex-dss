version: "1.0"
profiles:
  - profile_id: "slice_local_default"
    label: "Базовый локальный рейтинг"
    description: "Основная настройка базового контура: популярные показатели P, C, C_frac, h, i10, g. Расширенные формулы остаются дополнительным слоем анализа."
    metric_scope: "computed_from_slice_works"
    default_primary_metric: "h"
    sort:
      - field: "__primary_metric__"
        direction: "desc"
      - field: "c"
        direction: "desc"
      - field: "p"
        direction: "desc"
      - field: "author_id"
        direction: "asc"
    passport_key: "rank_by_metric_desc_c_desc_p_desc_author_id_asc"
