version: "1.0"
execution_limits:
  max_parallel_api_requests: 2
  max_enrichment_ids_per_entity: 10000
  max_chart_points: 5000
  max_top_n: 1000
  max_memory_mb: 4096
  require_estimate_before_fetch: true
  require_passport_before_analysis: true
storage_policy:
  max_filtered_cache_entries_per_run: 10
  estimate_cache_ttl_hours: 24
  delete_complete_download_parts_after_pack: true
  keep_partial_download_parts_for_repair: true
planner_thresholds:
  # Информационные пороги для UI. Они не блокируют скачивание.
  small_slice_works: 50000
  medium_slice_works: 300000
  hard_stop_works: 1000000
openalex:
  per_page: 100
  use_cursor: true
  max_or_values: 100
  cache_enabled: true
