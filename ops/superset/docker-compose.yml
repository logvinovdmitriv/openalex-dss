services:
  superset:
    build:
      context: .
      args:
        SUPERSET_IMAGE: ${SUPERSET_IMAGE:-apache/superset:latest}
    container_name: openalex-dss-superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-openalex-dss-local-dev-change-me}
    volumes:
      - ${OPENALEX_DSS_DATA_DIR:-../../../openalex-dss-data}:/app/openalex-dss/data:ro
      - superset_home:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    command: >
      /bin/bash -lc "
      superset db upgrade &&
      superset fab create-admin
        --username admin
        --firstname OpenAlex
        --lastname DSS
        --email admin@example.com
        --password admin || true &&
      superset init &&
      superset run -h 0.0.0.0 -p 8088 --with-threads"

volumes:
  superset_home:
