services:
  metabase:
    build:
      context: .
      args:
        METABASE_VERSION: ${METABASE_VERSION:-0.56.9}
        METABASE_DUCKDB_DRIVER_VERSION: ${METABASE_DUCKDB_DRIVER_VERSION:-1.4.1.1}
    container_name: openalex-dss-metabase
    ports:
      - "3000:3000"
    environment:
      MB_PLUGINS_DIR: /plugins
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - ${OPENALEX_DSS_DATA_DIR:-../../../openalex-dss-data}:/app/openalex-dss/data:ro
      - metabase_data:/metabase-data

volumes:
  metabase_data:
